# Maintained in the source repository and copied here; edits made here are overwritten.
name: Checks
run-name: Checks ${{ inputs.commit || 'main' }}${{ inputs.request && format(' · {0}', inputs.request) || '' }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit of the source repository to check (empty for the newest commit of main)
        required: false
        type: string
      request:
        description: Set by scripts/ci.sh to find this run
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: checks-${{ inputs.commit || 'main' }}
  cancel-in-progress: true

env:
  KODEM_CI_LOG_CERTIFICATE: ${{ vars.KODEM_CI_LOG_CERTIFICATE }}

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Format
    if: github.triggering_actor == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: adamwawrzynkowski/kodem-ade
          ref: ${{ inputs.commit }}
          token: ${{ secrets.KODEM_SOURCE_TOKEN }}
          persist-credentials: false
      - run: scripts/ci-step.sh format cargo fmt --all -- --check
      - name: Upload the encrypted logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-format
          path: ${{ runner.temp }}/kodem-logs/*.p7m
          if-no-files-found: ignore
          retention-days: 7

  clippy:
    name: Clippy (${{ matrix.os }})
    if: github.triggering_actor == github.repository_owner
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    environment: checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: adamwawrzynkowski/kodem-ade
          ref: ${{ inputs.commit }}
          token: ${{ secrets.KODEM_SOURCE_TOKEN }}
          persist-credentials: false
      - name: Install build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig-dev libfreetype-dev libxcb1-dev libwayland-dev libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev
      - name: Install the Vulkan SDK
        if: runner.os != 'macOS'
        run: scripts/install-vulkan-sdk.sh "$RUNNER_TEMP/vulkan"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: scripts/ci-step.sh clippy cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Upload the encrypted logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-clippy-${{ matrix.os }}
          path: ${{ runner.temp }}/kodem-logs/*.p7m
          if-no-files-found: ignore
          retention-days: 7

  codemap-contract:
    name: Code Map contract (${{ matrix.os }})
    if: github.triggering_actor == github.repository_owner
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    environment: checks
    defaults:
      run:
        working-directory: codemap
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: adamwawrzynkowski/kodem-ade
          ref: ${{ inputs.commit }}
          token: ${{ secrets.KODEM_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.4
      - run: ../scripts/ci-step.sh codemap-sync uv sync --frozen --extra mcp
      - run: ../scripts/ci-step.sh codemap-contract uv run --frozen pytest tests/test_kodem_main.py tests/test_kodem_mcp.py tests/test_kodem_linked.py -q --tb=short
      - name: Upload the encrypted logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-codemap-contract-${{ matrix.os }}
          path: ${{ runner.temp }}/kodem-logs/*.p7m
          if-no-files-found: ignore
          retention-days: 7

  codemap-suite:
    name: Code Map suite (ubuntu-22.04)
    if: github.triggering_actor == github.repository_owner
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment: checks
    defaults:
      run:
        working-directory: codemap
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: adamwawrzynkowski/kodem-ade
          ref: ${{ inputs.commit }}
          token: ${{ secrets.KODEM_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.4
      - run: ../scripts/ci-step.sh codemap-sync uv sync --frozen --all-extras
      - name: Run the suite
        run: |
          deselect=()
          while IFS= read -r test; do
            [[ -z "$test" || "$test" == \#* ]] || deselect+=(--deselect "$test")
          done < tests/kodem_known_failures.txt
          ../scripts/ci-step.sh codemap-suite uv run --frozen pytest tests -q --tb=short "${deselect[@]}"
      - name: Upload the encrypted logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-codemap-suite
          path: ${{ runner.temp }}/kodem-logs/*.p7m
          if-no-files-found: ignore
          retention-days: 7
